[patch]
id = "party-portrait-fix-k1"
name = "Party Portrait Fix (KotOR I)"
version = "0.1.0"
author = "Ryan Tomes"
description = "Stopgap for Party Roster Limit 32 (KPM 0.7.3): party selection portraits were blank. CSWSObject::GetPortrait, called on a creature, now answers as the creature's own GetPortrait does. Nothing in the game calls it on a creature; remove this once Party Roster Limit 32 calls CSWSCreature::GetPortrait."

