[patch]
id = "animation-rows"
name = "Animation Rows (KotOR I)"
version = "0.1.0"
author = "Ryan Tomes"
description = "Lets scripts play any animations.2da row on a creature: PlayAnimation / ActionPlayAnimation with 20000 + row. Vanilla rows no ANIMATION_* constant reaches (prone, sitdown, ...) and rows mods add (their own animation names, in their own models) - no shared animation slot is overridden."

