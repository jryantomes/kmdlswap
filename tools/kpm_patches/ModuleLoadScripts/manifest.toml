[patch]
id = "module-load-scripts"
name = "Module Load Scripts (KotOR I)"
version = "0.1.0"
author = "Ryan Tomes"
description = "After a module's own load script, runs every script modloadscripts.2da names for that module (or for every module: 'all'). Lets any number of mods run code whenever a module loads - in games already under way too, which a module.ifo edit cannot reach (saves keep each visited module's module.ifo). The 2DA (columns: module, script) is in the additional files; mods add their own rows."

requires = []
conflicts = []

