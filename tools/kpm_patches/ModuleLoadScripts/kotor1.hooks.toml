# CSWSModule::EventHandler, the module load case (event 0x11): mov ecx, [esi+0x20] / add esi, 0xc0 -
# whole instructions, nothing relative. RunModuleLoadScripts runs the module's own load script and the
# modloadscripts.2da rows for it, returns 1, and the game goes on at 0x004c5417 (after its RunScript).
[[hooks]]
address = 0x004C5215
type = "detour"
original_bytes = [0x8B, 0x4E, 0x20, 0x81, 0xC6, 0xC0, 0x00, 0x00, 0x00]
function = "RunModuleLoadScripts"
exclude_from_restore = ["eax"]
consumed_exit_address = 0x004C5417

[[hooks.parameters]]
source = "esi"
type = "pointer" # the CSWSModule
