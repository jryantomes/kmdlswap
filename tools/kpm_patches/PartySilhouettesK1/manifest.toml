[patch]
id = "party-silhouettes-k1"
name = "Party Silhouettes (KotOR I)"
version = "0.1.0"
author = "Ryan Tomes"
description = "With Party Roster Limit 32, a companion in slots 9 to 31 gets a silhouette on the party screen while it isn't available, as every vanilla companion has. Companion mods register theirs in partysilhouettes.2da (columns: slot, or slotglobal for a slot kept in a global number as Party Slots does, and silhouette, a texture). Slots without a row stay empty. A stopgap until Party Roster Limit 32 has this itself."

requires = ["party-roster-limit-32-k1"]
conflicts = []

