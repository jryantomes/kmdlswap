# CVirtualMachineInternal::InitializeScript(script, code, codeSize), entry: push ebx /
# mov ebx, [esp+8] / push ebp - whole instructions, nothing relative. Every script's bytecode
# passes through here on its way to the copy the script runs from (operator new + rep movs right
# after), so the loops are widened in the code it is about to copy.
[[hooks]]
address = 0x005D16F0
type = "detour"
original_bytes = [0x53, 0x8B, 0x5C, 0x24, 0x08, 0x55]
function = "WidenPartyClears"
exclude_from_restore = []

[[hooks.parameters]]
source = "[esp+8]"
type = "pointer" # the script's bytecode

[[hooks.parameters]]
source = "[esp+12]"
type = "int" # its length

# CSWVirtualMachineCommands::ExecuteCommandRemovePartyMember(command, argCount), entry: push ecx /
# mov ecx, [0x007A3A00] (the virtual machine) - whole instructions, an absolute address, nothing
# relative. A script that removes five or more named slots (the Star Forge's k_psta_door,
# k_psta_mlkparty, k_psta_pc_j) also has slots 9-31 removed (ExtendNamedPartyClear).
[[hooks]]
address = 0x00541C00
type = "detour"
original_bytes = [0x51, 0x8B, 0x0D, 0x00, 0x3A, 0x7A, 0x00]
function = "ExtendNamedPartyClear"
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer" # the command implementer
