[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kmdlswap"
version = "0.0.1"
description = "Scoped tool to swap the geometry of a single mesh node in a vanilla KOTOR 1 model"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pykotor>=2.3.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Build-time only. The app needs none of this to run, and a bundled build
# carries none of it - see `excludes` in kmdlfun.spec.
build = ["pyinstaller>=6.0"]
dev = ["pytest>=8"]

[project.scripts]
kmdlswap = "kmdlswap.cli:main"
kmdlfun = "kmdlfun.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-corpus sweeps over the whole game install"]
addopts = "-m 'not slow'"
